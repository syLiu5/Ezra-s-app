<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd9e8" />
  <title>成长足迹</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 柔和动态渐变背景（缓慢流动光晕） -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <header id="topbar"></header>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar"></nav>

  <div id="toast" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- 依赖顺序：supabase-js → 工具库 → 数据 → 本地库 → 状态 → 配置 → 账号 → 同步 → 各页面 → 启动 -->
  <!-- 本地优先加载 supabase-js（避免国内 CDN 不稳定）；CDN 作为兜底 -->
  <script src="js/lib/supabase.js"></script>
  <script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');</script>
  <script src="js/lib/ui.js"></script>
  <script src="js/lib/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="app/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/food.js"></script>
  <script src="js/screens/parenting.js"></script>
  <script src="js/screens/items.js"></script>
  <script src="js/screens/ledger.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
